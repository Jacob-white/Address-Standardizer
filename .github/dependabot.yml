version: 2

# Weekly update PRs; minor and patch updates are grouped into one PR per ecosystem, majors arrive individually.
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /sdks/typescript
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /sdks/dotnet
    schedule:
      interval: weekly
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
    ignore:
      # The client library targets netstandard2.0 and net8.0 and deliberately keeps the System.Text.Json 8.x (LTS) floor so
      # consumers are not forced onto a newer runtime package. A major bump also needs Microsoft.Bcl.AsyncInterfaces to move
      # in lockstep (NU1605 otherwise). Security patches on 8.x still arrive as minor/patch updates.
      - dependency-name: "System.Text.Json"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Bcl.AsyncInterfaces"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gomod
    directory: /sdks/go
    schedule:
      interval: weekly
    groups:
      gomod-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
