version: 2

# Weekly updates scheduled for Monday morning (06:00 UTC).
# Minor and patch updates are grouped into consolidated PRs per ecosystem, while major bumps arrive individually.
# Preserves the System.Text.Json 8.x floor for .NET consumers and adds release cooldowns.
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
    groups:
      python-dev:
        dependency-type: development
        update-types: [minor, patch]
      python-runtime:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
    groups:
      cargo-dev:
        dependency-type: development
        update-types: [minor, patch]
      cargo-runtime:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /sdks/typescript
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /sdks/dotnet
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
    ignore:
      # The client library targets netstandard2.0 and net8.0 and deliberately keeps the System.Text.Json 8.x (LTS) floor so
      # consumers are not forced onto a newer runtime package. A major bump also needs Microsoft.Bcl.AsyncInterfaces to move
      # in lockstep (NU1605 otherwise). Security patches on 8.x still arrive as minor/patch updates.
      - dependency-name: "System.Text.Json"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Bcl.AsyncInterfaces"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gomod
    directory: /sdks/go
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
    groups:
      gomod-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
