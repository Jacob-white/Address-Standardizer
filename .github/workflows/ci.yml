name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: pip install -e ".[server,arrow]"
      - run: ruff check .
      - name: Tests with coverage (excluding absolute-throughput SLA tests)
        run: pytest -m "not perf" --cov --cov-report=term
      - name: Throughput / memory SLA tests (no coverage tracing)
        run: pytest -m perf

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --no-default-features
        continue-on-error: true  # PyO3 extension-module crates may not link under `cargo test`; maturin job below is authoritative
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install maturin pytest hypothesis
      - run: maturin build --release --out dist && pip install dist/*.whl && pip install -e .
      - run: pytest tests/native tests/test_rust_acceleration.py tests/test_address_standardization_improvements.py

  sdks:
    # Builds and tests every client SDK, then runs each against a live server (contract + integration).
    runs-on: ubuntu-latest
    env:
      ADDRESS_STANDARDIZER_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: pip install -e ".[server,dev]"
      - name: SDK models match the server's OpenAPI schema
        run: pytest tests/test_sdk_contract.py
      - name: Start server
        run: |
          nohup python -m uvicorn address_standardizer.server:app --port 8000 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf $ADDRESS_STANDARDIZER_URL/health && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: TypeScript
        working-directory: sdks/typescript
        run: |
          npm ci
          npm test
      - name: Go
        working-directory: sdks/go
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...
      - name: .NET
        run: dotnet test sdks/dotnet/tests/AddressStandardizer.Client.Tests -c Release
      - name: Server log
        if: failure()
        run: cat server.log
