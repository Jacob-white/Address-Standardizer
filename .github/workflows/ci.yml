name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Least privilege: nothing in CI needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to commit SHAs (the comment names the tag/branch they were resolved from).
jobs:
  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: pip install -e ".[server,arrow]"
      - run: ruff check .
      - name: Tests with coverage (excluding absolute-throughput SLA tests)
        run: pytest -m "not perf" --cov --cov-report=term
      - name: Throughput / memory SLA tests (no coverage tracing)
        # Shared runners are slower and noisier than dev hardware: allow 40% headroom, so a 2x regression still fails.
        env:
          ADDRESS_STANDARDIZER_SLA_SCALE: "0.6"
        run: pytest -m perf

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: "1.85.0"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Rust unit tests
        run: cargo test --locked
      - run: pip install maturin
      - run: pip install -r requirements-dev.txt
      - run: pip install -e ".[server,arrow]"
      - name: Build the native extension and place it next to the editable install
        # maturin's wheel carries only the Rust module and shares the project name with the Python package, so it is
        # unpacked into site-packages rather than pip-installed (which would replace the Python package).
        run: |
          maturin build --release --locked --out dist
          python -m zipfile -e dist/*.whl native_x
          cp -r native_x/_address_standardizer_rs "$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')/"
          python -c "from address_standardizer import _native_dispatch as n; assert n.is_native_available(), 'native extension not importable'"
      - name: Native/pure parity and acceleration tests (must not skip)
        run: pytest -m "not perf" tests/native tests/test_rust_acceleration.py tests/test_address_standardization_improvements.py -rs

  sdks:
    # Builds and tests every client SDK, then runs each against a live server (contract + integration).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ADDRESS_STANDARDIZER_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.21"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - run: pip install -e ".[server,dev]"
      - name: SDK models match the server's OpenAPI schema
        run: pytest tests/test_sdk_contract.py
      - name: Start server
        run: |
          nohup python -m uvicorn address_standardizer.server:app --port 8000 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf $ADDRESS_STANDARDIZER_URL/health && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: TypeScript
        working-directory: sdks/typescript
        run: |
          npm ci
          npm test
      - name: Go
        working-directory: sdks/go
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...
      - name: .NET
        run: dotnet test sdks/dotnet/tests/AddressStandardizer.Client.Tests -c Release
      - name: Server log
        if: failure()
        run: cat server.log

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the image
        run: docker build -t address-standardizer:ci .
      - name: Smoke test (non-root, native core active, health and standardize)
        run: |
          docker run -d --name as-ci -p 127.0.0.1:8000:8000 address-standardizer:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health >/dev/null && break; sleep 1; done
          test "$(docker exec as-ci id -u)" != "0"
          docker exec as-ci python -c "from address_standardizer import _native_dispatch as n; assert n.is_native_available()"
          curl -sf -X POST http://127.0.0.1:8000/v1/standardize -H 'content-type: application/json' \
            -d '{"address":"100 Wall St, New York, NY 10005"}' | grep -q '"street1":"100 WALL ST"'
          docker rm -f as-ci
