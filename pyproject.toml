[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "address-standardizer"
version = "1.0.0"
description = "Fast, multi-jurisdiction address standardization, USPS Pub 28 parsing, two-tier entity resolution clustering, and Census geocoding."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Jacob White", email = "jake@hobbyhabbit.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: General",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
ml = [
    "usaddress>=0.5.16",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "usaddress>=0.5.16",
]

[project.scripts]
address-standardizer = "address_standardizer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["address_standardizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
