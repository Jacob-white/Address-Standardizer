[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "address-standardizer"
version = "3.3.0"
description = "Universal multi-national address standardization, offline spatial rooftop geocoding, high-throughput acceleration, and cross-border corporate entity resolution."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "HobbyHabbit LLC", email = "support@hobbyhabbit.com" }
]
maintainers = [
    { name = "Jacob White", email = "jake@hobbyhabbit.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: General",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "requests>=2.28.0",
    "h3>=4.0.0",
]

[project.optional-dependencies]
ml = [
    "usaddress>=0.5.16",
]
benchmark = [
    "psutil>=5.9.0",
]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
]
redis = [
    "redis>=5.0",
]
translit = [
    "anyascii>=0.3",
]
otel = [
    "opentelemetry-api>=1.20",
]
arrow = [
    "pyarrow>=14.0.0",
    "polars>=0.20.0",
    "duckdb>=0.10.0",
    "numpy>=1.24",  # required by DuckDB Python UDFs
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "usaddress>=0.5.16",
    "hypothesis>=6.100.0",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[project.scripts]
address-standardizer = "address_standardizer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["address_standardizer*"]

[tool.setuptools.package-data]
address_standardizer = ["service/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".claude", "node_modules", ".git", "build", "dist"]
python_files = ["test_*.py"]
markers = [
    "perf: absolute-throughput/memory SLA tests; run without coverage tracing (pytest -m perf)",
]

[tool.coverage.run]
source = ["address_standardizer"]
branch = true

[tool.coverage.report]
fail_under = 100
skip_empty = true

[tool.ruff]
line-length = 120
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Scripts and optional-dependency tests set sys.path / call importorskip before importing.
"benchmarks/*.py" = ["E402"]
"tests/test_arrow_duckdb.py" = ["E402"]

[tool.maturin]
features = ["extension-module"]
