[package]
name = "_address_standardizer_rs"
version = "3.3.0"
edition = "2021"

[lib]
name = "_address_standardizer_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
aho-corasick = "1.1"
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = []
wasm = ["wasm-bindgen"]
