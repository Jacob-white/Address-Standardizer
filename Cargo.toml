[package]
name = "_address_standardizer_rs"
version = "3.3.0"
edition = "2021"
rust-version = "1.74"
description = "Optional native acceleration module for the Address Standardizer (American Soundex)."
authors = ["HobbyHabbit LLC <support@hobbyhabbit.com>"]
license = "MIT"
repository = "https://github.com/Jacob-white/Address-Standardizer"
readme = "README.md"
publish = false

[lib]
name = "_address_standardizer_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = "0.22"

[features]
default = []
# maturin enables this for wheel builds; `cargo test` runs without it so the test binary can link libpython.
extension-module = ["pyo3/extension-module"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
